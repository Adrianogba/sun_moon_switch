name: Publish to pub.dev

# Publishes whenever a version tag is pushed. Authentication happens over OIDC,
# so there is no long-lived pub.dev token stored in this repository.
#
# This does not use the reusable dart-lang/setup-dart publish workflow, because
# that one runs `dart pub get`, which cannot resolve a package that depends on
# the Flutter SDK. setup-dart is still used, since it is what exchanges the
# GitHub OIDC token for pub.dev credentials.
#
# The tag pattern here has to match the one configured on the package admin
# page at https://pub.dev/packages/sun_moon_switch/admin (`v{{version}}`).

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required to authenticate with pub.dev over OIDC.

    steps:
      - uses: actions/checkout@v5

      # Configures the pub.dev credentials from the OIDC token.
      - uses: dart-lang/setup-dart@v1

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Re-tagging an already published version should not fail the run.
      - name: Check whether this version is already on pub.dev
        id: check
        run: |
          version=$(awk '/^version:/ {print $2; exit}' pubspec.yaml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if curl -sfo /dev/null "https://pub.dev/api/packages/sun_moon_switch/versions/$version"; then
            echo "sun_moon_switch $version is already published, skipping."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the tag matches the pubspec version
        if: steps.check.outputs.published == 'false'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="${{ steps.check.outputs.version }}"
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pubspec version $version." >&2
            exit 1
          fi

      - name: Publish
        if: steps.check.outputs.published == 'false'
        run: flutter pub publish --force
